name: book-notes

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-book_notes}
      POSTGRES_USER: ${POSTGRES_USER:-book_notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-book_notes_password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - book-notes-network

  app:
    image: book-notes:local
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-book_notes}
      DATABASE_USER: ${POSTGRES_USER:-book_notes}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-book_notes_password}
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks:
      - book-notes-network

volumes:
  postgres-data:

networks:
  book-notes-network:
    driver: bridge
