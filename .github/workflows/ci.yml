name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: PostgreSQL integration tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run the isolated test stack
        run: npm run test:container

      - name: Clean up the test stack
        if: always()
        run: npm run test:container:down

  production-image:
    name: Build and smoke-test the production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality
      - integration

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the multi-stage image
        run: docker build --tag book-notes:local .

      - name: Start the application stack
        run: docker compose up --detach --wait --no-build

      - name: Test the application endpoints
        run: |
          curl --fail --show-error http://127.0.0.1:3000/health
          curl --fail --show-error http://127.0.0.1:3000/ready

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up the application stack
        if: always()
        run: docker compose down --volumes
