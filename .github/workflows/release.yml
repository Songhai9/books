name: Release Docker Image

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE: ghcr.io/songhai9/books

jobs:
  security:
    name: Scan the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7

      - name: Build the release candidate
        run: docker build --tag book-notes:release-candidate .

      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: book-notes:release-candidate
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Generate the release CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: book-notes:release-candidate
          format: cyclonedx-json
          artifact-name: book-notes-${{ github.ref_name }}-sbom
          output-file: book-notes-${{ github.ref_name }}.cdx.json
          upload-artifact-retention: 90
          upload-release-assets: false

  publish:
    name: Publish versioned image to GHCR
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the release commit to belong to main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Book Notes
            org.opencontainers.image.description=Simple Express and PostgreSQL book notes application

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Pull the published version
        run: docker pull "${IMAGE}:${{ steps.metadata.outputs.version }}"

      - name: Start the published image
        run: >-
          docker run --detach --name book-notes-release-smoke
          --publish 127.0.0.1:3000:3000
          "${IMAGE}:${{ steps.metadata.outputs.version }}"

      - name: Verify the published image
        run: |
          for _ in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs book-notes-release-smoke

      - name: Clean up the smoke test
        if: always()
        run: docker rm --force book-notes-release-smoke || true

      - name: Write the release summary
        run: |
          printf "### Published image\n\`%s:%s\`\nDigest: \`%s\`\n" \
            "$IMAGE" \
            "${{ steps.metadata.outputs.version }}" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the published image to Kubernetes
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: Songhai9/books-k8s/.github/workflows/deploy.yml@bd5be956e04fc7bd3e0bc97712339e53c4a86b2e
    with:
      image_tag: ${{ needs.publish.outputs.image_tag }}
      aws_role_arn: ${{ vars.AWS_KUBERNETES_CD_ROLE_ARN }}
      control_plane_instance_id: ${{ vars.KUBERNETES_CONTROL_PLANE_INSTANCE_ID }}
