name: Application Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Audit Node.js dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Block high and critical dependency vulnerabilities
        run: npm audit --audit-level=high

  codeql:
    name: Analyze JavaScript with CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript

      - name: Analyze the application
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:javascript-typescript

  image:
    name: Scan production image and generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --tag book-notes:security .

      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: book-notes:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Generate the CycloneDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: book-notes:security
          format: cyclonedx-json
          artifact-name: book-notes-sbom
          output-file: book-notes.cdx.json
          upload-artifact-retention: 14
          upload-release-assets: false

  required:
    name: Required application security checks
    if: always()
    needs:
      - secrets
      - dependencies
      - codeql
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify all security jobs passed
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "${SECRETS_RESULT}" = "success"
          test "${DEPENDENCIES_RESULT}" = "success"
          test "${CODEQL_RESULT}" = "success"
          test "${IMAGE_RESULT}" = "success"
